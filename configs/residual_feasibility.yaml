name: validation_only_transformation_aligned_residual_feasibility
status: frozen_before_validation_metrics
scope:
  partition: outer_validation_pseudo_query
  outer_test_labels_and_predictions: prohibited
graph:
  representation: ecfp4
  radius: 2
  bits: 2048
  query_to_train_k: 10
  similarity_floor: 0.4
models:
  ridge_alpha: 10.0
  node_features:
    - frozen_gine_embedding
    - frozen_gine_prediction
  directed_edge_features:
    - frozen_gine_embedding_difference
    - frozen_gine_prediction_difference
  edge_antisymmetry: augment_reverse_orientation_and_fit_without_intercept
  edge_absolute_anchor: outer_train_mean_residual
  correction_etas: [0.25, 0.5, 1.0]
  primary_eta: 0.5
controls:
  permuted_edge_delta_targets: true
  permutation_seed: 29012026
evaluation:
  primary: validation_internal_mmp_cliff_endpoint_mae
  secondary: [overall_mae, pair_delta_mae, correction_residual_correlation, correction_sign_accuracy]
  aggregation: seed_then_fold_then_target_macro
decision:
  minimum_edge_cliff_improvement_vs_base: 0.03
  maximum_edge_overall_degradation_vs_base: 0.01
  minimum_endpoint_correction_residual_correlation: 0.10
  minimum_endpoint_correction_sign_accuracy: 0.55
  edge_must_beat_node_residual: true
  edge_must_beat_permuted_control: true
  minimum_improved_targets: 4
  sensitivity_eta_cannot_replace_failed_primary: true
