name: authorized_real_boundary_cut_diagnostic_floor08
partition: outer_validation_pseudo_query
reference_partition: outer_train
outer_test_access: forbidden
base_model: frozen_scg_gine
graph:
  representation: ecfp4
  radius: 2
  bits: 2048
  query_to_train_k: 10
  similarity_floor: 0.8
  weight: tanimoto
boundary:
  activity_difference: 1.0
  oracle: remove_query_reference_edges_at_or_above_threshold
  random: exact_per_query_oracle_cut_count
  similarity: remove_lowest_similarity_edges_at_exact_per_query_oracle_cut_count
propagation:
  rule: convex_mix_of_base_query_and_weighted_frozen_reference_predictions
  lambdas: [0.1, 0.25, 0.5, 0.75]
  primary_lambda: 0.5
  no_remaining_neighbor_fallback: base_query_prediction
random:
  replicates: 20
  seed: 29012026
evaluation:
  methods: [base, global, oracle, random, similarity]
  primary: validation_internal_mmp_cliff_endpoint_mae
  secondary: [overall_mae, pair_delta_mae]
  aggregation: seed_then_fold_then_target_macro
decision:
  minimum_oracle_cliff_improvement_vs_global: 0.05
  maximum_oracle_overall_degradation_vs_global: 0.01
  oracle_must_beat_random: true
