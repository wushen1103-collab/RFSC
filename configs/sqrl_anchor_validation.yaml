controls:
  permutation_seed: 29012026
evaluation:
  primary: validation_internal_mmp_cliff_endpoint_mae
  secondary: [overall_mae, pair_delta_mae, correction_residual_correlation, correction_sign_accuracy]
  aggregation: seed_then_fold_then_target_macro
decision:
  minimum_primary_cliff_improvement_vs_base: 0.03
  maximum_primary_overall_degradation_vs_base: 0.01
  minimum_endpoint_correction_residual_correlation: 0.10
  minimum_endpoint_correction_sign_accuracy: 0.55
  primary_must_beat_label_knn: true
  primary_must_beat_permuted_control: true
  minimum_improved_targets: 4

