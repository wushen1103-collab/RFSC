  outer_test_labels_and_predictions: prohibited
  tier: labeled_query_anchor_baseline_not_bps
graph:
  representation: ecfp4
  radius: 2
  bits: 2048
  query_to_train_k: 10
  similarity_floor: 0.4
methods:
