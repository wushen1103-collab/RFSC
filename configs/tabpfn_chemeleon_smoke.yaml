evaluation:
  smoke_train_size: 64
  smoke_query_size: 16
  smoke_tasks:
    - {target: CHEMBL287_Ki, fold: 0, seed: 42}
  full_validation_tasks:
    - {target: CHEMBL287_Ki, fold: 0, seed: 42}
  replication_tasks:
    - {target: CHEMBL2971_Ki, fold: 0, seed: 42}
    - {target: CHEMBL4616_EC50, fold: 0, seed: 42}
  support_gate_tasks:
    - {target: CHEMBL4005_Ki, fold: 0, seed: 42}
    - {target: CHEMBL4203_Ki, fold: 0, seed: 42}
  primary_ensemble: equal_rf_gine_tabpfn
  primary_weights: [0.3333333333, 0.3333333333, 0.3333333334]
  no_parameter_search: true
