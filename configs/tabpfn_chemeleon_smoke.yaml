method: tabpfn_chemeleonfp
protocol: strict_scg_validation_only
data_root: data/processed/moleculeace
chemeleon:
  checkpoint: ${CHEMELEON_CHECKPOINT:-external/checkpoints/chemeleon_mp.valid}
  checkpoint_bytes: 34859448
  checkpoint_sha256: c376624d3407204e780a0ed13a9ac097cc9bb1c13ef89cdbc633c1715c183651
  device: cuda:0
  batch_size: 256
tabpfn:
  # Two estimators are the bounded smoke configuration; promoted runs use 8.
  n_estimators_smoke: 2
  n_estimators_full: 8
  device: cuda
  ignore_pretraining_limits: true
  feature_clip: [-6.0, 6.0]
