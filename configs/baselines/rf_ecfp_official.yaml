method: rf_ecfp
protocol: moleculeace_official
data_root: data/processed/moleculeace
fingerprint:
  radius: 2
  n_bits: 1024
selection:
  group_column: scaffold_group
  folds: 3
  seed: 2901
  criterion: train_only_group_cv_rmse
  n_estimators: [100, 250, 500, 1000]
model:
  n_jobs: 8
  max_features: 1.0
  min_samples_leaf: 1
evaluation:
  official_reference_csv: ${MOLECULEACE_RESULTS_CSV:-external/MoleculeACE/MoleculeACE/Data/results/MoleculeACE_results.csv}
  response: y_pactivity
  overall_metric: rmse
  cliff_metric: official_cliff_endpoint_rmse
seeds: [0, 1, 2]

